name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  ESP_IDF_REVISION: 7b9cc1ac79f865983f59bb8ff3ff43eb74ff1dbe
  IRIS_REQUIRE_HOST_CC: "1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python tools/check_repository_layout.py
      - run: python esp-mosaico-recovery/mosaico.py --version

  host:
    name: Host / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      CJSON_COMPONENT_DIR: ${{ github.workspace }}/.host-deps/cjson
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15-intel, windows-2022]
        python: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up GSP bootstrap Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Prepare pinned GSP host dependencies
        run: |
          python -m pip install --disable-pip-version-check esp-gsp-tools==0.1.1
          python -m pip install --disable-pip-version-check -r esp-mosaico-recovery/firmware/recovery/tools/requirements.txt
          python tools/ci/prepare_gsp.py

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Make MinGW compiler available
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append'
      - name: Install host dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          -r ESP-Iris/components/esp_iris/tools/requirements.lock
          -r ESP-Iris/components/esp_iris/tools/requirements-test.txt
          -r esp-mosaico-recovery/tests/requirements-ui.txt
      - name: Install Recovery C test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - uses: actions/checkout@v7
        with:
          repository: DaveGamble/cJSON
          ref: c859b25da02955fef659d658b8f324b5cde87be3 # v1.7.19
          path: .host-deps/cjson
          persist-credentials: false
      - name: Test ESP-Iris
        run: python -m pytest -q --ignore=tests/e2e --junitxml=iris-results.xml
        working-directory: ESP-Iris/components/esp_iris/tools
      - name: Test ESP-Mosaico Tools
        if: runner.os != 'Windows'
        run: python -m pytest -q mosaico-tools/tests esp-mosaico-recovery/tests --junitxml=tools-results.xml
      - name: Test ESP-Mosaico Tools on Windows
        if: runner.os == 'Windows'
        run: >-
          python -m pytest -q mosaico-tools/tests esp-mosaico-recovery/tests
          --deselect=esp-mosaico-recovery/tests/test_cli.py::GatewayTests::test_local_system_update_builds_and_submits_atomic_bundle
          --deselect=esp-mosaico-recovery/tests/test_cli.py::HostCompatibilityTests::test_idf_environment_uses_idf_python_without_a_shell
          --deselect=esp-mosaico-recovery/tests/test_cli.py::HostCompatibilityTests::test_python38_runtime_hands_idf_to_a_newer_python
          --deselect=esp-mosaico-recovery/tests/test_cli.py::RecoveryCommandTests::test_idf_wrapper_reports_bounded_cmake_diagnostic
          --junitxml=tools-results.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: host-${{ matrix.os }}-python-${{ matrix.python }}
          path: |
            ESP-Iris/components/esp_iris/tools/iris-results.xml
            tools-results.xml
          if-no-files-found: error
          retention-days: 14

  quality:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: >-
          python -m pip install --disable-pip-version-check
          -r ESP-Iris/components/esp_iris/tools/requirements.lock
          -r ESP-Iris/components/esp_iris/tools/requirements-dev.txt
      - run: python tools/check_esp_iris_budgets.py --group source_lines
        working-directory: ESP-Iris
      - run: python -m ruff check --target-version py38 iris_gateway tests
        working-directory: ESP-Iris/components/esp_iris/tools
      - run: python -m mypy iris_gateway
        working-directory: ESP-Iris/components/esp_iris/tools
      - run: >-
          python -m compileall -q
          mosaico-tools/tools
          esp-mosaico-recovery/tools
          ESP-Iris/components/esp_iris/tools/iris_gateway

  sanitizers:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      IRIS_HOST_SANITIZERS: "1"
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -r ESP-Iris/components/esp_iris/tools/requirements-test.txt
      - name: Install Recovery C test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - uses: actions/checkout@v7
        if: runner.os == 'Linux'
        with:
          repository: DaveGamble/cJSON
          ref: c859b25da02955fef659d658b8f324b5cde87be3 # v1.7.19
          path: .host-deps/cjson
          persist-credentials: false
      - name: Configure Recovery C test dependency
        if: runner.os == 'Linux'
        run: echo "CJSON_COMPONENT_DIR=$GITHUB_WORKSPACE/.host-deps/cjson" >> "$GITHUB_ENV"
      - run: python -m pytest -q mosaico-tools/tests esp-mosaico-recovery/tests/test_bridge_host.py
      - run: python -m pytest -q tests/test_firmware_runtime.py tests/test_file_service_lifecycle.py
        working-directory: ESP-Iris/components/esp_iris/tools

  frontend:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ESP-Iris/components/esp_iris/tools/frontend/package-lock.json
      - run: npm ci
        working-directory: ESP-Iris/components/esp_iris/tools/frontend
      - run: npm run test:unit
        working-directory: ESP-Iris/components/esp_iris/tools/frontend
      - run: npm run build
        working-directory: ESP-Iris/components/esp_iris/tools/frontend
      - name: Verify committed Workbench distribution
        run: |
          python3 - <<'PY'
          import subprocess
          import sys

          result = subprocess.run(
              ["git", "status", "--porcelain", "--untracked-files=all", "--",
               "ESP-Iris/components/esp_iris/tools/frontend/dist"],
              check=True, capture_output=True, text=True,
          )
          if result.stdout.strip():
              print("Rebuild and commit the Workbench dist alongside its source:")
              print(result.stdout)
              sys.exit(1)
          PY
      - run: npm audit --audit-level=high
        working-directory: ESP-Iris/components/esp_iris/tools/frontend
      - run: python3 tools/check_esp_iris_budgets.py --group directory_bytes
        working-directory: ESP-Iris

  frontend-e2e:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: python -m pip install --disable-pip-version-check -r ESP-Iris/components/esp_iris/tools/requirements.lock
      - run: npm ci
        working-directory: ESP-Iris/components/esp_iris/tools/frontend
      - run: npm run build
        working-directory: ESP-Iris/components/esp_iris/tools/frontend
      - run: npx playwright install --with-deps chromium
        working-directory: ESP-Iris/components/esp_iris/tools/frontend
      - run: npm run test:e2e
        working-directory: ESP-Iris/components/esp_iris/tools/frontend
        env:
          PYTHON: python

  firmware:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        group: [baseline, media, ota, system]
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 750M
      IDF_CCACHE_ENABLE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Restore ESP-IDF tools
        uses: actions/cache@v6
        with:
          path: .idf/tools
          key: firmware-idf-tools-${{ runner.os }}-${{ env.ESP_IDF_REVISION }}
      - name: Restore compiler cache
        uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: firmware-ccache-${{ runner.os }}-${{ env.ESP_IDF_REVISION }}-${{ matrix.group }}-${{ github.sha }}
          restore-keys: |
            firmware-ccache-${{ runner.os }}-${{ env.ESP_IDF_REVISION }}-${{ matrix.group }}-
      - name: Restore pinned Recovery components
        if: matrix.group == 'system'
        uses: actions/cache@v6
        with:
          path: esp-mosaico-recovery/firmware/recovery/managed_components
          key: firmware-recovery-components-${{ runner.os }}-${{ hashFiles('esp-mosaico-recovery/firmware/recovery/dependencies.lock') }}
      - uses: actions/checkout@v7
        with:
          repository: espressif/esp-idf
          ref: ${{ env.ESP_IDF_REVISION }}
          path: .idf/esp-idf
          submodules: recursive
          persist-credentials: false
      - name: Install ESP-IDF tools
        shell: bash
        run: |
          export IDF_PATH="$GITHUB_WORKSPACE/.idf/esp-idf"
          export IDF_TOOLS_PATH="$GITHUB_WORKSPACE/.idf/tools"
          "$IDF_PATH/install.sh" all
          echo "IDF_PATH=$IDF_PATH" >> "$GITHUB_ENV"
          echo "IDF_TOOLS_PATH=$IDF_TOOLS_PATH" >> "$GITHUB_ENV"
      - name: Verify compiler cache
        shell: bash
        run: |
          if ! command -v ccache >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes ccache
          fi
          ccache --version
      - name: Prepare pinned Recovery GSP compiler
        run: |
          python -m pip install --disable-pip-version-check esp-gsp-tools==0.1.1
          python tools/ci/prepare_gsp.py --compiler-only

      - name: Build firmware (${{ matrix.group }})
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          python -m pip install --disable-pip-version-check -r esp-mosaico-recovery/firmware/recovery/tools/requirements.txt
          ccache --zero-stats
          bash tools/ci/build_firmware.sh "${{ matrix.group }}"
          ccache --show-stats
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: firmware-results-${{ matrix.group }}
          path: |
            ESP-Iris/build-ci-*/*.bin
            ESP-Iris/build-ci-*/*.elf
            ESP-Iris/build-ci-*/sdkconfig
            ESP-Iris/budget-results.json
            build-ci-recovery-factory/*.bin
            build-ci-recovery-factory/*.elf
            build-ci-recovery-factory/sdkconfig
          if-no-files-found: warn
          retention-days: 14

  required:
    if: always()
    needs: [repository, host, quality, sanitizers, frontend, frontend-e2e, firmware]
    runs-on: ubuntu-22.04
    steps:
      - run: |
          test "${{ needs.repository.result }}" = success
          test "${{ needs.host.result }}" = success
          test "${{ needs.quality.result }}" = success
          test "${{ needs.sanitizers.result }}" = success
          test "${{ needs.frontend.result }}" = success
          test "${{ needs.frontend-e2e.result }}" = success
          test "${{ needs.firmware.result }}" = success
